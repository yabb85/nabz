{% load i18n %}

<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title></title>
        {% load static %}
        <link rel="stylesheet" href="{% static 'css/pure-min.css' %}">
        <link rel="stylesheet" href="{% static 'css/grids-responsive-min.css' %}">
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
    </head>
    <body>
        <div class="custom-wrapper pure-g" id="menu">
            <div class="pure-u-1 pure-u-md-1-3">
                <div class="pure-menu">
                    <a href="/" class="pure-menu-heading custom-brand">Lapinou</a>
                    <a href="#" class="custom-toggle" id="toggle"><s class="bar"></s><s class="bar"></s></a>
                </div>
            </div>
            <div class="pure-u-1 pure-u-md-1-3">
                <div class="pure-menu pure-menu-horizontal custom-can-transform">
                    <ul class="pure-menu-list">
                        <li class="pure-menu-item"><a href="/vl/bunny" class="pure-menu-link">{% trans "Bunny" %}</a></li>
                        <li class="pure-menu-item"><a href="/vl/zstamp" class="pure-menu-link">ZStamps</a></li>
                        <li class="pure-menu-item"><a href="/vl/plugin" class="pure-menu-link">Plugins</a></li>
                    </ul>
                </div>
            </div>
            <div class="pure-u-1 pure-u-md-1-3">
                <div class="pure-menu pure-menu-horizontal custom-menu-3 custom-can-transform">
                    <ul class="pure-menu-list">
                        {% if user.is_authenticated %}
                            <li class="pure-menu-item">
                                <form action="{% url 'logout' %}" method="post">
                                    {% csrf_token %}
                                    <button type="submit" class="log">{% translate "Logout" %}</button>
                                </form>
                            </li>
                        {% else %}
                            <li class="pure-menu-item">
                                <form action="{% url 'login' %}" method="post">
                                    {% csrf_token %}
                                    <button type="submit" class="log">{% translate "Login" %}</button>
                                </form>
                            </li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </div>
        <script>
            (function (window, document) {
                var menu = document.getElementById('menu'),
                    rollback,
                    WINDOW_CHANGE_EVENT = ('onorientationchange' in window) ? 'orientationchange':'resize';

                function toggleHorizontal() {
                    menu.classList.remove('closing');
                    [].forEach.call(
                        document.getElementById('menu').querySelectorAll('.custom-can-transform'),
                        function(el){
                            el.classList.toggle('pure-menu-horizontal');
                        }
                    );
                };

                function toggleMenu() {
                    // set timeout so that the panel has a chance to roll up
                    // before the menu switches states
                    if (menu.classList.contains('open')) {
                        menu.classList.add('closing');
                        rollBack = setTimeout(toggleHorizontal, 500);
                    }
                    else {
                        if (menu.classList.contains('closing')) {
                            clearTimeout(rollBack);
                        } else {
                            toggleHorizontal();
                        }
                    }
                    menu.classList.toggle('open');
                    document.getElementById('toggle').classList.toggle('x');
                };

                function closeMenu() {
                    if (menu.classList.contains('open')) {
                        toggleMenu();
                    }
                }

                document.getElementById('toggle').addEventListener('click', function (e) {
                    toggleMenu();
                    e.preventDefault();
                });

                window.addEventListener(WINDOW_CHANGE_EVENT, closeMenu);
            })(this, this.document);

        </script>
        <style>
            .main {
                padding: 2em;
                color: black;
            }
        </style>

        <div class="main">
            {% block content %}
            {% endblock %}
        </div>
    </body>
</html>
